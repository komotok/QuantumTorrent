[package]
name = "quantum-torrent"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quantum_torrent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vendored fork of librqbit 8.1.1, patched to expose `incoming_connections` on
# the session stats so the UI can tell a reachable listen port from a
# firewalled one. See vendor/librqbit/PATCHES.md.
librqbit = { version = "8", path = "vendor/librqbit" }
librqbit-core = "5"
tokio = { version = "1", features = ["full"] }
# Enumerates local network interfaces for the bind-to-interface setting.
if-addrs = "0.13"
# Torrent search. Same major version as librqbit's reqwest so the TLS backend
# isn't duplicated.
reqwest = { version = "0.12", features = ["json"] }
roxmltree = "0.20"
# Loopback-only HTTP server for previewing a file while it downloads. All of
# these are already in the tree via reqwest/librqbit, so they cost nothing new.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
mime_guess = "2"
rand = "0.8"
maxminddb = "0.30.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
